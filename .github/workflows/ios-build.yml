name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fix executable permissions
        # Guards against node_modules binaries losing their executable bit —
        # most commonly seen if node_modules ever got committed to git from a
        # Windows machine, since Windows filesystems don't track the Unix
        # executable bit the way macOS/Linux do. Harmless to run even if
        # that's not what happened here.
        run: chmod +x node_modules/.bin/*

      - name: Add iOS platform if missing
        # "cap sync" only syncs a platform folder that already exists — it
        # doesn't create one. If ios/ was never committed to the repo (or got
        # excluded by .gitignore somewhere along the way), this generates it
        # fresh so the build can't fail with "App.xcworkspace does not exist."
        run: |
          if [ ! -d "ios" ]; then
            echo "ios/ not found — running cap add ios"
            npx cap add ios
          else
            echo "ios/ already present — skipping cap add"
          fi

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        # This is what actually generates App.xcworkspace — cap sync is
        # supposed to trigger this on its own, but isn't reliably doing so on
        # this runner image, so it's run explicitly here instead. Safe to run
        # even if cap sync already did this correctly.
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Verify workspace exists
        run: ls -la ios/App/

      - name: Build iOS (unsigned archive)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r App.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-ipa
          path: ${{ runner.temp }}/App.ipa